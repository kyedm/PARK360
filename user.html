<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park360 - Canlı Otopark Bulucu &amp; Boş Yer Takibi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B1120;
            --bg-card: #1E293B;
            --bg-dark: #0F172A;
            --border-color: #334155;
            --accent: #6366F1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --free: #10B981;
            --occupied: #EF4444;
            --ev: #06B6D4;
            --disabled: #F59E0B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ÜST NAVİGASYON ÇUBUĞU */
        .navbar {
            height: 72px;
            background: var(--bg-dark);
            border-bottom: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            font-size: 11px;
            font-weight: 700;
            color: #818CF8;
            margin-left: 6px;
            background: rgba(99, 102, 241, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--free);
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--free);
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 4px var(--free)); }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* ANA SAYFA DÜZENİ */
        .container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
        }

        /* SOL PANEL: OTOPARK ARAMA & LİSTELEME */
        .search-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1.5px solid var(--border-color);
            padding: 14px 16px 14px 42px;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .panel-heading {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .lot-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 240px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .lot-item {
            background: var(--bg-card);
            border: 1.5px solid transparent;
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lot-item:hover {
            transform: translateY(-2px);
            border-color: var(--border-color);
            background: #243248;
        }

        .lot-item.active {
            border-color: var(--accent);
            background: #182238;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .lot-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .lot-item h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .rate-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .lot-item p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .lot-item-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 12px;
            font-size: 13px;
        }

        .stat-free {
            color: var(--free);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* SAĞ PANEL: CANLI PLAN VE DOLULUK GÖSTERGESİ */
        .lot-detail {
            background: var(--bg-dark);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .lot-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        .detail-title h2 {
            font-size: 26px;
            font-weight: 800;
        }

        .detail-title p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ÖZET KARTLAR */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .summary-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-card span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .summary-card h4 {
            font-size: 26px;
            font-weight: 800;
        }

        /* FİLTRE VE KAT ÇUBUĞU */
        .filter-floor-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
        }

        .floor-tabs {
            display: flex;
            gap: 8px;
        }

        .floor-tab {
            background: var(--bg-card);
            color: var(--text-muted);
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .floor-tab.active {
            background: var(--accent);
            color: white;
        }

        .spot-filters {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            border-color: white;
            color: white;
            background: rgba(255,255,255,0.08);
        }

        /* CANLI PARK IZGARASI (PLAN) */
        .plan-legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        .spots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .customer-spot {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 18px 16px;
            border: 2px solid;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            transition: all 0.2s ease;
        }

        .customer-spot.free {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
        }

        .customer-spot.free:hover {
            transform: scale(1.02);
            border-color: var(--free);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
        }

        .customer-spot.occupied {
            border-color: rgba(239, 68, 68, 0.2);
            background: rgba(239, 68, 68, 0.03);
            opacity: 0.6;
        }

        .customer-spot.ev-spot.free {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.05);
        }

        .customer-spot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spot-code {
            font-size: 18px;
            font-weight: 800;
        }

        .spot-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 6px;
        }

        .tag-ev {
            background: rgba(6, 182, 212, 0.15);
            color: var(--ev);
        }

        .tag-disabled {
            background: rgba(245, 158, 11, 0.15);
            color: var(--disabled);
        }

        .spot-state {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* BOŞ DURUM MESAJI */
        .empty-view {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        /* ================= RESPONSIVE AYARLARI ================= */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px 16px;
                gap: 20px;
            }

            .lot-cards {
                max-height: 260px;
            }

            .summary-bar {
                grid-template-columns: repeat(3, 1fr);
            }

            .spots-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 0 16px;
                height: 64px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .brand span {
                display: none;
            }

            .summary-bar {
                grid-template-columns: 1fr;
            }

            .filter-floor-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .floor-tabs, .spot-filters {
                overflow-x: auto;
                padding-bottom: 4px;
            }

            .floor-tab, .filter-btn {
                white-space: nowrap;
                flex: 1;
                text-align: center;
            }

            .plan-legend {
                flex-wrap: wrap;
                gap: 10px;
            }

            .spots-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .customer-spot {
                min-height: 95px;
                padding: 14px 12px;
            }

            .spot-code {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ÜST ÇUBUK -->
    <header class="navbar">
        <div class="brand">
            <div class="brand-logo">P</div>
            <div>
                <h1>Park360 <span>MÜŞTERİ PORTALI</span></h1>
            </div>
        </div>
        <div class="live-tag">
            <div class="live-dot"></div>
            Canlı Otopark Ağı Yayında
        </div>
    </header>

    <!-- ANA GÖVDE -->
    <main class="container">
        <!-- SOL PANEL: OTOPARK ARAMA & SEÇİM -->
        <section class="search-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Otopark adı veya ilçe ara..." oninput="handleSearch()">
            </div>

            <div class="panel-heading">Şehir Otoparkları</div>
            <div class="lot-cards" id="lotListContainer"></div>
        </section>

        <!-- SAĞ PANEL: CANLI DOLULUK DETAYI & KAT PLANI -->
        <section class="lot-detail">
            <div class="lot-detail-header">
                <div class="detail-title">
                    <h2 id="lotTitle">Bir Otopark Seçin</h2>
                    <p id="lotAddress">Seçilen otoparkın canlı kat ve slot durumları burada listelenir</p>
                </div>
            </div>

            <!-- ÖZET METRİK KARTLARI -->
            <div class="summary-bar">
                <div class="summary-card">
                    <span>Mevcut Boş Yer Sayısı</span>
                    <h4 id="statFreeSpots" style="color: var(--free);">0</h4>
                </div>
                <div class="summary-card">
                    <span>Toplam Kapasite</span>
                    <h4 id="statTotalSpots">0</h4>
                </div>
                <div class="summary-card">
                    <span>Anlık Doluluk Oranı</span>
                    <h4 id="statOccupancyRate" style="color: #38BDF8;">%0</h4>
                </div>
            </div>

            <!-- KAT VE FİLTRE BUTONLARI -->
            <div class="filter-floor-bar">
                <div class="floor-tabs" id="floorTabsContainer"></div>
                <div class="spot-filters">
                    <button class="filter-btn active" onclick="setFilter('all', this)">Tümü</button>
                    <button class="filter-btn" onclick="setFilter('freeOnly', this)">Sadece Boşlar</button>
                    <button class="filter-btn" onclick="setFilter('evOnly', this)">⚡ EV Şarj</button>
                </div>
            </div>

            <!-- LEJANT -->
            <div class="plan-legend">
                <div class="legend-item"><div class="legend-color" style="background: var(--free);"></div> Boş Alan</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--occupied);"></div> Dolu Alan</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--ev);"></div> Elektrikli Şarj (EV)</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--disabled);"></div> Engelli Park Alanı</div>
            </div>

            <!-- KAT PLANI IZGARASI -->
            <div class="spots-grid" id="customerSpotsContainer"></div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'PARK360_DATA';
        let parkingLots = [];
        let selectedLotId = null;
        let selectedFloor = 1;
        let activeFilter = 'all'; // all, freeOnly, evOnly

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                parkingLots = JSON.parse(raw);
            } else {
                // Eğer yönetici paneli henüz çalıştırılmadıysa örnek başlangıç verisi üret
                parkingLots = [
                    generateMockLot(1, "Kadıköy Rıhtım Otoparkı", "Kadıköy / İstanbul", 3, 16),
                    generateMockLot(2, "Levent Metro Otoparkı", "Şişli / İstanbul", 2, 12),
                    generateMockLot(3, "Havalimanı Çok Katlı Otopark", "Arnavutköy / İstanbul", 3, 16)
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(parkingLots));
            }

            if (parkingLots.length > 0 && selectedLotId === null) {
                selectedLotId = parkingLots[0].id;
            }
            renderView();
        }

        function generateMockLot(id, name, district, floors, spotsPerFloor) {
            const spots = [];
            for (let f = 1; f <= floors; f++) {
                const prefix = String.fromCharCode(64 + f);
                for (let i = 1; i <= spotsPerFloor; i++) {
                    const type = i <= 2 ? 'Disabled' : (i <= 4 ? 'EV' : 'Standard');
                    const isOccupied = Math.random() > 0.45;
                    spots.push({
                        id: `${prefix}-${String(i).padStart(2, '0')}`,
                        floor: f,
                        type: type,
                        isOccupied: isOccupied,
                        plate: isOccupied ? `34 ABC ${100 + i}` : null
                    });
                }
            }
            return { id, name, district, totalFloors: floors, spots };
        }

        function getSelectedLot() {
            return parkingLots.find(l => l.id === selectedLotId);
        }

        function renderView() {
            renderLotList();
            renderLotDetails();
        }

        function renderLotList() {
            const container = document.getElementById('lotListContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            const filtered = parkingLots.filter(l => 
                l.name.toLowerCase().includes(searchVal) || 
                l.district.toLowerCase().includes(searchVal)
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-view">Aranan kriterde otopark bulunamadı.</div>';
                return;
            }

            filtered.forEach(lot => {
                const total = lot.spots.length;
                const free = lot.spots.filter(s => !s.isOccupied).length;
                const rate = total === 0 ? 0 : Math.round(((total - free) / total) * 100);

                let rateColor = 'rgba(16, 185, 129, 0.15)';
                let rateTextColor = 'var(--free)';
                if (rate > 85) {
                    rateColor = 'rgba(239, 68, 68, 0.15)';
                    rateTextColor = 'var(--occupied)';
                } else if (rate > 60) {
                    rateColor = 'rgba(245, 158, 11, 0.15)';
                    rateTextColor = 'var(--disabled)';
                }

                const item = document.createElement('div');
                item.className = `lot-item ${lot.id === selectedLotId ? 'active' : ''}`;
                item.onclick = () => {
                    selectedLotId = lot.id;
                    selectedFloor = 1;
                    renderView();
                };

                item.innerHTML = `
                    <div class="lot-item-top">
                        <h3>${lot.name}</h3>
                        <span class="rate-badge" style="background: ${rateColor}; color: ${rateTextColor};">%${rate} Dolu</span>
                    </div>
                    <p>📍 ${lot.district}</p>
                    <div class="lot-item-stats">
                        <span class="stat-free">● ${free} Boş Yer</span>
                        <span style="color: var(--text-muted);">${lot.totalFloors} Katlı Tesis</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderLotDetails() {
            const lot = getSelectedLot();
            if (!lot) return;

            document.getElementById('lotTitle').innerText = lot.name;
            document.getElementById('lotAddress').innerText = `📍 ${lot.district} • Toplam ${lot.totalFloors} Katlı Otopark Tesisi`;

            const total = lot.spots.length;
            const free = lot.spots.filter(s => !s.isOccupied).length;
            const occupied = total - free;
            const rate = total === 0 ? 0 : Math.round((occupied / total) * 100);

            document.getElementById('statFreeSpots').innerText = free;
            document.getElementById('statTotalSpots').innerText = total;
            document.getElementById('statOccupancyRate').innerText = `%${rate}`;

            renderFloorTabs(lot.totalFloors);
            renderSpotsGrid(lot);
        }

        function renderFloorTabs(floors) {
            const tabsContainer = document.getElementById('floorTabsContainer');
            tabsContainer.innerHTML = '';

            for (let f = 1; f <= floors; f++) {
                const btn = document.createElement('button');
                btn.className = `floor-tab ${f === selectedFloor ? 'active' : ''}`;
                btn.innerText = `${f}. Kat ${f === 1 ? '(Giriş/Zemin)' : ''}`;
                btn.onclick = () => {
                    selectedFloor = f;
                    renderLotDetails();
                };
                tabsContainer.appendChild(btn);
            }
        }

        function renderSpotsGrid(lot) {
            const grid = document.getElementById('customerSpotsContainer');
            grid.innerHTML = '';

            let spots = lot.spots.filter(s => s.floor === selectedFloor);

            // Filtreleri uygula
            if (activeFilter === 'freeOnly') {
                spots = spots.filter(s => !s.isOccupied);
            } else if (activeFilter === 'evOnly') {
                spots = spots.filter(s => s.type === 'EV');
            }

            if (spots.length === 0) {
                grid.innerHTML = '<div class="empty-view" style="grid-column: 1 / -1;">Bu katta seçtiğiniz kritere uygun park yeri bulunamadı.</div>';
                return;
            }

            spots.forEach(spot => {
                const card = document.createElement('div');
                const isFree = !spot.isOccupied;
                const isEv = spot.type === 'EV';

                card.className = `customer-spot ${isFree ? 'free' : 'occupied'} ${isEv ? 'ev-spot' : ''}`;

                let tagHtml = '';
                if (spot.type === 'EV') tagHtml = '<span class="spot-tag tag-ev">⚡ EV Şarj</span>';
                if (spot.type === 'Disabled') tagHtml = '<span class="spot-tag tag-disabled">♿ Engelli</span>';

                let statusHtml = isFree 
                    ? `<span style="color: var(--free);">● MÜSAİT (BOŞ)</span>` 
                    : `<span style="color: var(--occupied);">✕ DOLU</span>`;

                card.innerHTML = `
                    <div class="customer-spot-header">
                        <span class="spot-code" style="color: ${isFree ? (isEv ? 'var(--ev)' : 'var(--free)') : 'var(--occupied)'};">${spot.id}</span>
                        ${tagHtml}
                    </div>
                    <div class="spot-state">
                        ${statusHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFilter(type, btnElement) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            const lot = getSelectedLot();
            if (lot) renderSpotsGrid(lot);
        }

        function handleSearch() {
            renderLotList();
        }

        // Yönetici panelinden gelen anlık araç giriş/çıkışlarını yakalamak için storage dinleyici
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                loadData();
            }
        });

        // Sayfa açıldığında başlat
        loadData();
    </script>
</body>
</html>
